# Which repository the CMS saves into, and how it authenticates.
backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Update {{collection}} from admin'

# Where uploaded images go, and the path the site should use to read them.
media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  # ---------------------------------------------------------------- PROJECTS
  - name: projects
    label: Projects
    files:
      - name: list
        label: All projects
        file: content/projects.json
        description: >
          Every project on the Work page. Tick UI/UX to give a project the full
          case study layout; anything else gets the showcase layout.
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: '{{fields.title}} — {{fields.client}} ({{fields.year}})'
            fields:
              - { name: id, label: ID (leave as is), widget: number, value_type: int }
              - { name: slug, label: "Web address (lowercase, hyphens, no spaces)", widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
              - { name: title, label: Project title, widget: string }
              - { name: client, label: Client, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: cover, label: Cover image, widget: image, required: false, hint: "Shown on the Work page and at the top of the project" }
              - name: categories
                label: Categories
                widget: select
                multiple: true
                options: ['Branding', 'Social', 'UI/UX', 'Digital', 'Motion', 'Print']
                hint: "A project can sit in several. UI/UX gives it a case study."
              - { name: role, label: Your role, widget: list, hint: "One per line, e.g. Art Direction" }
              - { name: shortDescription, label: One-line summary, widget: text }
              - { name: description, label: Description, widget: text }
              - { name: challenge, label: "Challenge (case studies only)", widget: text, required: false }
              - { name: approach, label: "Approach (case studies only)", widget: text, required: false }
              - { name: solution, label: "Solution (case studies only)", widget: text, required: false }
              - { name: outcome, label: "Outcome (case studies only)", widget: text, required: false }
              - name: metrics
                label: Metrics
                widget: list
                required: false
                hint: "Three show on the card. Leave empty to show none."
                field: { name: pair, label: "Figure and label", widget: list, hint: "First line the figure, second the label" }
              - name: credits
                label: Credits
                widget: list
                required: false
                field: { name: pair, label: "Role and name", widget: list }
              - name: gallery
                label: Gallery
                widget: list
                required: false
                hint: "Each entry: width class, aspect class, caption"
                field: { name: item, label: Item, widget: list }

  # ----------------------------------------------------------------- PROFILE
  - name: profile
    label: About you
    files:
      - name: details
        label: Contact and background
        file: content/profile.json
        fields:
          - { name: email, label: Email, widget: string }
          - { name: phone, label: "Phone (as displayed)", widget: string }
          - { name: phoneHref, label: "Phone (dial format)", widget: string, hint: "e.g. tel:+918233703094" }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: behance, label: Behance URL, widget: string }
          - { name: instagram, label: Instagram URL, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: resumePdf, label: "Resume PDF filename", widget: string }
          - name: experience
            label: Experience
            widget: list
            summary: '{{fields.role}} — {{fields.company}}'
            fields:
              - { name: period, label: Dates, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: desc, label: Description, widget: text }
          - name: education
            label: Education
            widget: list
            summary: '{{fields.role}} — {{fields.company}}'
            fields:
              - { name: period, label: Dates, widget: string }
              - { name: role, label: Qualification, widget: string }
              - { name: company, label: Institution, widget: string }
              - { name: desc, label: Description, widget: text }
          - { name: skills, label: Skills, widget: list }
          - { name: tools, label: Tools, widget: list }

  # ------------------------------------------------------------- SITE COPY
  - name: copy
    label: Website text
    files:
      - name: all
        label: All wording
        file: content/copy.json
        description: >
          Every heading, label and button on the site. Leave a field blank to
          fall back to the original wording. Some fields contain HTML entities
          such as &rsquo; for an apostrophe — keep those as they are.
        fields:
          # Hero
          - { name: "hero.eyebrow", label: "Hero — eyebrow", widget: string, required: false }
          - { name: "hero.line1", label: "Hero — first line", widget: string, required: false }
          - { name: "hero.line2", label: "Hero — second line", widget: string, required: false }
          - { name: "hero.highlight", label: "Hero — highlighted word", widget: string, required: false }
          - { name: "hero.cta2", label: "Hero — second button", widget: string, required: false }
          # Home page
          - { name: "home.workEyebrow", label: "Home — work eyebrow", widget: string, required: false }
          - { name: "home.workTitle", label: "Home — work title", widget: string, required: false }
          - { name: "home.workSub", label: "Home — work intro", widget: string, required: false }
          - { name: "home.workCta", label: "Home — view all button", widget: string, required: false }
          - { name: "home.capsEyebrow", label: "Home — capabilities eyebrow", widget: string, required: false }
          - { name: "home.capsTitle", label: "Home — capabilities title", widget: string, required: false }
          - { name: "home.capsSub", label: "Home — capabilities intro", widget: string, required: false }
          - { name: "home.caseEyebrow", label: "Home — case study eyebrow", widget: string, required: false }
          - { name: "home.caseCta", label: "Home — case study button", widget: string, required: false }
          - { name: "home.aboutEyebrow", label: "Home — about eyebrow", widget: string, required: false }
          - { name: "home.aboutTitle", label: "Home — about title", widget: string, required: false }
          - { name: "home.aboutCta", label: "Home — about button", widget: string, required: false }
          - { name: "home.expEyebrow", label: "Home — experience eyebrow", widget: string, required: false }
          - { name: "home.expTitle", label: "Home — experience title", widget: string, required: false }
          - { name: "home.expCta", label: "Home — experience button", widget: string, required: false }
          - { name: "home.contactEyebrow", label: "Home — contact eyebrow", widget: string, required: false }
          # Case study labels
          - { name: "caseLabels.challenge", label: "Label — Challenge", widget: string, required: false }
          - { name: "caseLabels.approach", label: "Label — Approach", widget: string, required: false }
          - { name: "caseLabels.solution", label: "Label — Solution", widget: string, required: false }
          # Contact
          - { name: "contact.cta", label: "Contact — talk button", widget: string, required: false }
          - { name: "contact.callOpt", label: "Contact — popup call option", widget: string, required: false }
          - { name: "contact.emailOpt", label: "Contact — popup email option", widget: string, required: false }
          - { name: "contact.hint", label: "Contact — key hint", widget: string, required: false }
          - { name: "contact.dtEmail", label: "Contact — email label", widget: string, required: false }
          - { name: "contact.dtCall", label: "Contact — call label", widget: string, required: false }
          - { name: "contact.dtLinkedin", label: "Contact — LinkedIn label", widget: string, required: false }
          - { name: "contact.dtLocation", label: "Contact — location label", widget: string, required: false }
          - { name: "contact.linkedinText", label: "Contact — LinkedIn link text", widget: string, required: false }
          # Footer
          - { name: "footer.pages", label: "Footer — pages heading", widget: string, required: false }
          - { name: "footer.elsewhere", label: "Footer — elsewhere heading", widget: string, required: false }
          - { name: "footer.copyright", label: "Footer — copyright", widget: string, required: false }
          - { name: "footer.credit", label: "Footer — credit line", widget: string, required: false }
          # Work page
          - { name: "work.eyebrow", label: "Work page — eyebrow", widget: string, required: false }
          - { name: "work.empty", label: "Work page — empty message", widget: string, required: false }
          # Project pages
          - { name: "proj.introLabel", label: "Project — introduction label", widget: string, required: false }
          - { name: "proj.challengeLabel", label: "Project — challenge label", widget: string, required: false }
          - { name: "proj.challengeTitle", label: "Project — challenge title", widget: string, required: false }
          - { name: "proj.approachLabel", label: "Project — approach label", widget: string, required: false }
          - { name: "proj.approachTitle", label: "Project — approach title", widget: string, required: false }
          - { name: "proj.designLabel", label: "Project — design label", widget: string, required: false }
          - { name: "proj.systemLabel", label: "Project — system label", widget: string, required: false }
          - { name: "proj.systemTitle", label: "Project — system title", widget: string, required: false }
          - { name: "proj.outcomeLabel", label: "Project — outcome label", widget: string, required: false }
          - { name: "proj.outcomeTitle", label: "Project — outcome title", widget: string, required: false }
          - { name: "proj.nextLabel", label: "Project — next label", widget: string, required: false }
          - { name: "proj.aboutLabel", label: "Showcase — about label", widget: string, required: false }
          - { name: "proj.workLabel", label: "Showcase — work label", widget: string, required: false }
          - { name: "proj.workTitle", label: "Showcase — work title", widget: string, required: false }
          # About page
          - { name: "about.eyebrow", label: "About — eyebrow", widget: string, required: false }
          - { name: "about.l1", label: "About — title line 1", widget: string, required: false }
          - { name: "about.l2", label: "About — title line 2", widget: string, required: false }
          - { name: "about.l3", label: "About — title line 3", widget: string, required: false }
          - { name: "about.storyLabel", label: "About — story label", widget: string, required: false }
          - { name: "about.storyTitle", label: "About — story title", widget: string, required: false }
          - { name: "about.whoEyebrow", label: "About — who eyebrow", widget: string, required: false }
          - { name: "about.whoTitle", label: "About — who title", widget: string, required: false }
          - { name: "about.philEyebrow", label: "About — philosophy eyebrow", widget: string, required: false }
          - { name: "about.philTitle", label: "About — philosophy title", widget: string, required: false }
          - { name: "about.pillar1t", label: "About — pillar 1 title", widget: string, required: false }
          - { name: "about.pillar2t", label: "About — pillar 2 title", widget: string, required: false }
          - { name: "about.pillar3t", label: "About — pillar 3 title", widget: string, required: false }
          - { name: "about.expEyebrow", label: "About — experience eyebrow", widget: string, required: false }
