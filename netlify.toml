# Netlify configuration
# This site is a single static HTML file. There is no build step and no
# framework — Netlify just serves the files in this folder as they are.

[build]
  publish = "."
  command = ""

# Basic security headers. These do not affect how the site looks or behaves.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
